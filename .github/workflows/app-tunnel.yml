name: Techy App Tunnel Setup

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/setup_tunnel.sh'
      - '.github/workflows/app-tunnel.yml'

permissions: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE: ${{ secrets.CF_ZONE_ID }}
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup named tunnel app.techy.id
        run: |
          bash .github/scripts/setup_tunnel.sh > /tmp/tci.log 2>&1
          RC=$?
          cat /tmp/tci.log
          exit $RC
      - name: Ship CI log to VPS
        if: always()
        run: |
          install -m 600 /dev/null ~/.ssh/id
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" > ~/.ssh/kh 2>/dev/null || true
          scp -i ~/.ssh/id -o UserKnownHostsFile=~/.ssh/kh -o StrictHostKeyChecking=no -P "$VPS_PORT" /tmp/tci.log "$VPS_USER@$VPS_HOST:/root/tci.log" || true
