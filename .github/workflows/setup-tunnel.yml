name: setup-tunnel

on:
  workflow_dispatch:

permissions: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Create / reuse tunnel and route DNS
        run: |
          set -e
          mkdir -p ~/.cloudflared
          # reuse if exists, else create
          TUN=$(cloudflared tunnel list 2>/dev/null | awk '$2=="techy-wa"{print $1}' | head -1)
          if [ -z "$TUN" ]; then
            cloudflared tunnel create techy-wa
            TUN=$(cloudflared tunnel list 2>/dev/null | awk '$2=="techy-wa"{print $1}' | head -1)
          fi
          echo "TUN=$TUN"
          # route DNS app.techy.id -> tunnel (creates CNAME automatically)
          cloudflared tunnel route dns techy-wa app.techy.id --overwrite-dns-record || true
          # expose tunnel id for next step
          echo "TUN_ID=$TUN" >> "$GITHUB_ENV"

      - name: Push credentials to VPS and restart tunnel
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          install -m 600 /dev/null ~/.ssh/id_ed25519
          echo "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # copy tunnel credentials json to VPS
          CRED=$(ls ~/.cloudflared/*.json 2>/dev/null | head -1)
          if [ -n "$CRED" ]; then
            scp -P "$VPS_PORT" "$CRED" "$VPS_USER@$VPS_HOST:/root/.cloudflared/techy-wa.json"
          fi
          # write config + systemd on VPS, then restart
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" bash -s <<EOF
          set -e
          TUN="$TUN_ID"
          mkdir -p /root/.cloudflared
          cat > /root/.cloudflared/config.yml <<YAML
          tunnel: \$TUN
          credentials-file: /root/.cloudflared/techy-wa.json
          ingress:
            - hostname: app.techy.id
              service: http://localhost:3000
            - service: http_status:404
          YAML
          cat > /etc/systemd/system/cf-tunnel.service <<SVC
          [Unit]
          Description=Techy WA Gateway Cloudflare Named Tunnel
          After=network-online.target techywa.service
          Wants=network-online.target

          [Service]
          Type=simple
          ExecStartPre=/bin/sleep 3
          ExecStart=/usr/local/bin/cloudflared tunnel --config /root/.cloudflared/config.yml run
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          SVC
          pkill -f 'cloudflared tunnel' 2>/dev/null || true
          systemctl daemon-reload
          systemctl enable --now cf-tunnel
          sleep 6
          systemctl is-active cf-tunnel
          EOF
