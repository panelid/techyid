name = "techy-id"
main = ".open-next/worker.js"
compatibility_date = "2026-08-09"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# CF_API_TOKEN and CF_ZONE_ID are set as Worker secrets.

[[d1_databases]]
binding = "DB"
database_name = "techy-db"
database_id = "8fcbea87-08e4-4df1-b145-222db8b8dd20"

[[kv_namespaces]]
binding = "SLUGS"
id = "367138400cb041e5b500fd2517ef99ef"

[[routes]]
pattern = "techy.id/*"
zone_name = "techy.id"
